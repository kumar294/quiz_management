name: CI
on:
  push:
    paths: ["mba_placement_prep/**"]
  pull_request:
    paths: ["mba_placement_prep/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mba_placement_prep/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mba_placement_prep/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mba_placement_prep/frontend/package-lock.json
      - run: npm install
      - run: npm run lint --if-present
      - run: npm run build
